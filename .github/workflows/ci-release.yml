name: CI & Cross-Platform Release

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Test & Lint (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend strict TypeScript check
        run: npm run typecheck

      - name: Frontend unit & workflow tests
        run: npm test

      - name: Frontend production build check
        run: npm run build

      - name: Rust format check
        working-directory: ./src-tauri
        run: cargo fmt --all -- --check

      - name: Rust Clippy lint
        working-directory: ./src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust unit, integration, and fault-injection tests
        working-directory: ./src-tauri
        run: cargo test --all-targets --no-fail-fast

  build-verification:
    name: Verify Installer Build (${{ matrix.platform }})
    needs: lint-and-test
    if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - platform: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
          - platform: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri Desktop Bundle (CI Verification Only)
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Generate SHA-256 Checksums
        shell: bash
        run: |
          find src-tauri/target -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.app.tar.gz" \) -exec shasum -a 256 {} + > CHECKSUMS-${{ matrix.platform }}.txt
          cat CHECKSUMS-${{ matrix.platform }}.txt

      - name: Upload Checksums & Build Verification Artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-verification-${{ matrix.platform }}
          path: |
            CHECKSUMS-${{ matrix.platform }}.txt
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  publish-release:
    name: Publish Official Release (${{ matrix.platform }})
    needs: lint-and-test
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            os: windows-latest
            args: "--target x86_64-pc-windows-msvc"
          - platform: macos-aarch64
            os: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-x86_64
            os: macos-latest
            args: "--target x86_64-apple-darwin"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-apple-darwin,x86_64-apple-darwin

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and Publish Tauri Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional code signing & macOS notarization secrets (see docs/release.md):
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Codex Move ${{ github.ref_name }}"
          releaseBody: |
            ## Codex Move Release
            - Peer-to-peer LAN migration for Codex chats, Skills, config, and projects (Windows ↔ macOS).
            - Note on Unsigned Builds: If building without commercial Apple/Microsoft code-signing secrets, verify SHA-256 checksums before running. Never disable system security globally.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Generate SHA-256 Checksums
        shell: bash
        run: |
          find src-tauri/target -type f \( -name "*.exe" -o -name "*.msi" -o -name "*.dmg" -o -name "*.app.tar.gz" \) -exec shasum -a 256 {} + > CHECKSUMS-${{ matrix.platform }}.txt
          cat CHECKSUMS-${{ matrix.platform }}.txt

      - name: Upload Checksums Artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.platform }}
          path: CHECKSUMS-${{ matrix.platform }}.txt
